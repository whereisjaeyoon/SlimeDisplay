[package]
name = "slime-display-server"
version = "0.1.0"
edition = "2021"
description = "Cross-platform server that streams SlimeDisplay virtual displays over WebRTC"
publish = false

[features]
default = []
# Link against the real SlimeDisplay native library (SlimeDisplay.dll / SlimeDisplay.framework).
# Without it, the server runs on an in-process mock backend.
native = []
# Generate FFI bindings from the C headers with bindgen (requires libclang).
# Without it, the hand-maintained bindings in src/ffi/slimedisplay.rs are used.
bindgen = ["native", "dep:bindgen"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
bytes = "1"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Refer to this crate as `::webrtc` inside the project: `crate::webrtc` is our own module.
webrtc = "0.11"

[build-dependencies]
bindgen = { version = "0.70", optional = true }
